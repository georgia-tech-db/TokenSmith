name: macOS Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-macos:
    name: Package macOS App (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Python runtime
        run: npm run setup:python-runtime

      - name: Package macOS app
        run: npm run package:mac

      - name: Verify packaged Python runtime
        run: |
          RUNTIME="release/mac/TokenSmith.app/Contents/Resources/app/app_runtime/python"
          test -x "$RUNTIME/bin/python"
          PYTHONHOME="$RUNTIME" DYLD_FALLBACK_LIBRARY_PATH="$RUNTIME/lib" \
            "$RUNTIME/bin/python" -c 'import faiss, numpy, pypdfium2, PIL'

      - name: Upload macOS package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TokenSmith-macos-${{ matrix.arch }}-${{ github.run_number }}
          path: release/TokenSmith-*-mac-*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Publish macOS package to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release/TokenSmith-*-mac-*.dmg
