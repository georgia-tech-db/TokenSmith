name: macOS Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-macos:
    name: Package macOS App
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Python runtime
        run: npm run setup:python-runtime

      - name: Package macOS app
        run: npm run package:mac

      - name: Verify packaged Python runtime
        run: |
          RUNTIME="release/mac/TokenSmith.app/Contents/Resources/app/app_runtime/python"
          test -x "$RUNTIME/bin/python"
          PYTHONHOME="$RUNTIME" DYLD_FALLBACK_LIBRARY_PATH="$RUNTIME/lib" \
            "$RUNTIME/bin/python" -c 'import faiss, jinja2, numpy, pypdfium2, PIL'

      - name: Upload macOS package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TokenSmith-macos-${{ github.run_number }}
          path: release/TokenSmith-*-mac-*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Publish macOS package to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            TokenSmith 0.1.12 improves retrieval quality and makes packaged app builds use a reproducible private Python runtime.

            Major changes in this release:
            - Adds hybrid semantic and keyword retrieval for better source grounding.
            - Supports marked Markdown source text.
            - Fixes Gemini model loading.
            - Uses a pinned standalone Python runtime with pinned runtime dependencies.
            - Verifies packaged app runtimes before uploading release artifacts.
            - Avoids duplicate release artifacts from manual workflow runs.

            Platform assets are attached as their packaging workflows finish.
          files: release/TokenSmith-*-mac-*.dmg
