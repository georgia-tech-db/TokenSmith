name: Linux Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-linux:
    name: Package Linux App
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system package tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev curl

      - name: Install Node dependencies
        run: npm ci

      - name: Build Python runtime
        run: npm run setup:python-runtime

      - name: Install AppImage tooling
        run: |
          curl -L \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Package Linux app
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run package:linux

      - name: Verify packaged Python runtime
        run: |
          CHECK_ROOT="$(mktemp -d)"
          DEB_PATH="$(find release -maxdepth 1 -name 'tokensmith_*.deb' -print -quit)"
          dpkg-deb -x "$DEB_PATH" "$CHECK_ROOT"
          RUNTIME="$CHECK_ROOT/opt/TokenSmith/resources/app/app_runtime/python"
          test -x "$RUNTIME/bin/python"
          test -z "$(find "$RUNTIME" -xtype l -print -quit)"
          PYTHONHOME="$RUNTIME" LD_LIBRARY_PATH="$RUNTIME/lib" \
            "$RUNTIME/bin/python" -c 'import faiss, jinja2, numpy, pypdfium2, PIL'

      - name: Upload Linux packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TokenSmith-linux-${{ github.run_number }}
          path: |
            release/TokenSmith-*-linux-*.tar.gz
            release/TokenSmith-*-linux-*.AppImage
            release/tokensmith_*_*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Publish Linux packages to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            TokenSmith 0.1.13 updates study chat, model setup, and collection preparation.

            Major changes in this release:
            - Adds model-aware context budgets, rewritten follow-up queries, and source-unit retrieval.
            - Adds cloud answer-model connections and improves Ollama model discovery.
            - Adds Markdown/math rendering, suggested questions, quoting, question navigation, and inline editing.
            - Defaults new collections to Basic preparation, with numbered-line AI preparation available as an experimental option.
            - Preserves source text and supports resumable AI preparation with validated boundary numbers.
            - Adds source-unit, preparation, chat, and model-discovery regression checks.

            Known limitations: AI grouping and generated-answer quality remain uneven. Basic is recommended for authored BuzzDB Markdown; the broader first-run redesign remains planned.

            Platform assets are attached as their packaging workflows finish.
          files: |
            release/TokenSmith-*-linux-*.tar.gz
            release/TokenSmith-*-linux-*.AppImage
            release/tokensmith_*_*.deb
