name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows App
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Python runtime
        run: npm run setup:python-runtime

      - name: Package Windows app
        run: npm run package:win

      - name: Verify packaged Python runtime
        shell: pwsh
        run: |
          $python = 'release/win/TokenSmith/resources/app/app_runtime/python/python.exe'
          if (-not (Test-Path $python)) {
            throw "Packaged Python runtime was not found at $python"
          }
          & $python -c 'import faiss, jinja2, numpy, pypdfium2, PIL'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TokenSmith-windows-${{ github.run_number }}
          path: release/TokenSmith-*-win-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish Windows package to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            TokenSmith 0.1.13 updates study chat, model setup, and collection preparation.

            Major changes in this release:
            - Adds model-aware context budgets, rewritten follow-up queries, and source-unit retrieval.
            - Adds cloud answer-model connections and improves Ollama model discovery.
            - Adds Markdown/math rendering, suggested questions, quoting, question navigation, and inline editing.
            - Defaults new collections to Basic preparation, with numbered-line AI preparation available as an experimental option.
            - Preserves source text and supports resumable AI preparation with validated boundary numbers.
            - Adds source-unit, preparation, chat, and model-discovery regression checks.

            Known limitations: AI grouping and generated-answer quality remain uneven. Basic is recommended for authored BuzzDB Markdown; the broader first-run redesign remains planned.
          files: release/TokenSmith-*-win-*.zip
